apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatling-mcp-server.fullname" . }}
  labels:
    {{- include "gatling-mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 58090
      protocol: TCP
      name: http
  selector:
    {{- include "gatling-mcp-server.selectorLabels" . | nindent 4 }}

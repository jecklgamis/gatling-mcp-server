apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatling-mcp-server.fullname" . }}
  labels:
    {{- include "gatling-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gatling-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gatling-mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gatling-mcp-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GATLING_SERVER_URL
              value: {{ .Values.gatlingServerUrl | quote }}
            - name: GATLING_MCP_REQUEST_TIMEOUT
              value: {{ .Values.requestTimeout | quote }}
            - name: GATLING_MCP_UPLOAD_TIMEOUT
              value: {{ .Values.uploadTimeout | quote }}
            - name: GATLING_MCP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatling-mcp-server.secretName" . }}
                  key: GATLING_MCP_API_TOKEN
            - name: GATLING_SERVER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatling-mcp-server.secretName" . }}
                  key: GATLING_SERVER_API_TOKEN
          ports:
            - name: http
              containerPort: 58090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

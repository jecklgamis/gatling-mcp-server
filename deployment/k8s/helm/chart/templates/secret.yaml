{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatling-mcp-server.fullname" . }}
  labels:
    {{- include "gatling-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATLING_MCP_API_TOKEN: {{ .Values.gatlingMcpApiToken | quote }}
  GATLING_SERVER_API_TOKEN: {{ .Values.gatlingServerApiToken | quote }}
{{- end }}

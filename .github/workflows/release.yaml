name: Release
on:
  push:
    tags: [ v* ]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set package version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${version}\"/" pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Set chart version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${version}/" deployment/k8s/helm/chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${version}\"/" deployment/k8s/helm/chart/Chart.yaml
      - name: Package Helm chart
        run: helm package deployment/k8s/helm/chart --destination dist
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.prerelease.outputs.flag }} \
            dist/*
